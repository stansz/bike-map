<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OGS Bike Map — BC Cycling Infrastructure</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚴</text></svg>">
<style>
  :root {
    --bg: #f8fafc; --surface: #ffffff; --surface2: #f1f5f9; --border: #e2e8f0;
    --text: #1e293b; --text2: #64748b; --accent: #22c55e; --accent2: #14b8a6;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  
  /* Header */
  .header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); z-index: 1000; flex-shrink: 0; }
  .header h1 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .header h1 span { color: var(--accent); }
  .header-links { display: flex; gap: 12px; align-items: center; }
  .header-links a { color: var(--text2); text-decoration: none; font-size: 13px; }
  .header-links a:hover { color: var(--text); }

  /* Mode toggle */
  .mode-toggle { display: flex; background: var(--surface2); border-radius: 20px; overflow: hidden; }
  .mode-toggle button { padding: 4px 12px; border: none; background: transparent; color: var(--text2); font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .mode-toggle button.active { background: var(--accent); color: #000; font-weight: 600; }
  .mode-toggle button:hover:not(.active) { color: var(--text); }

  /* Map container */
  #map { flex: 1; z-index: 1; }
  
  /* Sidebar panel */
  .panel { position: absolute; top: 52px; right: 12px; z-index: 999; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; width: 280px; max-height: calc(100vh - 72px); overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
  .panel-header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .panel-header h2 { font-size: 14px; font-weight: 600; }
  .panel-close { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 18px; padding: 0 4px; }
  .panel-close:hover { color: var(--text); }
  .panel-body { padding: 12px 14px; }
  
  /* Legend */
  .legend-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; cursor: pointer; }
  .legend-item:hover { background: var(--surface2); border-radius: 4px; }
  .legend-swatch { width: 24px; height: 4px; border-radius: 2px; flex-shrink: 0; }
  .legend-swatch.thick { height: 6px; }
  .legend-label { flex: 1; color: var(--text); }
  .legend-count { color: var(--text2); font-size: 11px; }
  .legend-item.disabled { opacity: 0.4; }
  .legend-item.disabled .legend-swatch { background: var(--text2) !important; }

  /* Controls */
  .controls { padding: 10px 14px; border-top: 1px solid var(--border); }
  .control-group { margin-bottom: 8px; }
  .control-group label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .control-group select, .control-group input { width: 100%; padding: 6px 8px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; font-size: 13px; }
  .control-group select:focus, .control-group input:focus { outline: none; border-color: var(--accent); }
  
  .btn { width: 100%; padding: 8px; background: var(--accent); color: #000; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn:hover { filter: brightness(1.1); }
  .btn.secondary { background: var(--surface2); color: var(--text); }
  .btn.locate { width: auto; padding: 6px 12px; background: var(--accent2); color: #fff; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .btn.locate.active { background: #0d9488; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  .btn.locate.error { background: var(--error, #ef4444); }

  /* User location marker */
  .user-marker { background: transparent; }
  .user-dot { width: 18px; height: 18px; background: #3b82f6; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 12px rgba(59,130,246,0.6); }
  .user-dot::after { content: ''; display: block; width: 6px; height: 6px; background: #fff; border-radius: 50%; position: absolute; top: 6px; left: 6px; }

  /* Stats bar */
  .stats-bar { padding: 6px 14px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 16px; font-size: 12px; color: var(--text2); z-index: 1000; flex-shrink: 0; }
  .stats-bar strong { color: var(--accent); }

  /* Popup */
  .leaflet-popup-content-wrapper { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; }
  .leaflet-popup-tip { background: var(--surface); }
  .leaflet-popup-content { margin: 10px 14px; font-size: 13px; line-height: 1.5; }
  .popup-class { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .popup-dot { width: 10px; height: 10px; border-radius: 50%; }
  .popup-meta { color: var(--text2); margin-top: 4px; }

  /* Loading */
  .loading { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 999; background: var(--surface); border: 1px solid var(--border); padding: 6px 16px; border-radius: 20px; font-size: 13px; color: var(--text2); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
  .loading.hidden { display: none; }

  /* Elevation profile */
  .elev-panel { position: absolute; bottom: 36px; left: 0; right: 0; z-index: 999; background: var(--surface); border-top: 1px solid var(--border); box-shadow: 0 -4px 16px rgba(0,0,0,0.15); transform: translateY(100%); transition: transform 0.3s ease; }
  .elev-panel.open { transform: translateY(0); }
  .elev-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--border); }
  .elev-header h3 { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .elev-stats { display: flex; gap: 12px; font-size: 12px; color: var(--text2); }
  .elev-stats .gain { color: #22c55e; font-weight: 600; }
  .elev-stats .loss { color: #ef4444; font-weight: 600; }
  .elev-close { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 16px; }
  .elev-close:hover { color: var(--text); }
  .elev-chart { padding: 4px 14px 8px; height: 120px; }
  .elev-chart svg { width: 100%; height: 100%; }
  .elev-hint { text-align: center; padding: 20px; color: var(--text2); font-size: 13px; }

  /* Route mode */
  .route-line { stroke: #3b82f6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .route-popup-class { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .route-popup-class span { display: inline-block; margin: 2px 4px 0 0; padding: 1px 6px; border-radius: 10px; font-size: 10px; color: #fff; }

  /* Mobile */
  @media (max-width: 640px) {
    .panel { width: calc(100% - 24px); right: 12px; left: 12px; }
    .header h1 { font-size: 14px; }
    .header-links { gap: 8px; }
    .elev-chart { height: 100px; }
  }
  .segment-label{background:rgba(0,0,0,0.6);color:white;font-size:10px;padding:2px 4px;border:none;border-radius:3px;white-space:nowrap}
</style>
</head>
<body>

<div class="header">
  <h1>🚴 <span>OGS</span> Bike Map</h1>
  <div class="header-links">
    <div class="mode-toggle" id="mode-toggle">
      <button class="active" onclick="setMode('segments')" id="btn-segments">Segments</button>
      <button onclick="setMode('routes')" id="btn-routes">Routes</button>
    </div>
    <a href="https://ogsapps.cc">Portal</a>
    <a href="https://sea.ogsapps.cc">Sea</a>
    <a href="https://elevation.ogsapps.cc">Elevation</a>
    <button class="btn locate" id="btn-locate" onclick="toggleLocate()" title="Use my location">
      <span id="locate-icon">📍</span> <span id="locate-text">Locate</span>
    </button>
    <button onclick="togglePanel()" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:16px" title="Toggle panel">⚙️</button>
  </div>
</div>

<div id="map"></div>

<div class="loading hidden" id="loading">Loading cycling data…</div>

<div class="panel" id="panel">
  <div class="panel-header">
    <h2>Cycling Layers</h2>
    <button class="panel-close" onclick="togglePanel()">✕</button>
  </div>
  <div class="panel-body">
    <div id="legend"></div>
  </div>
  <div class="controls">
    <div class="control-group">
      <label>Municipality</label>
      <select id="muni-filter" onchange="reloadData()">
        <option value="">All BC</option>
      </select>
    </div>
    <div class="control-group">
      <label>Road Type Filter</label>
      <select id="class-filter" onchange="reloadData()">
        <option value="">All types</option>
      </select>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn secondary" onclick="resetView()">Reset View</button>
    </div>
  </div>
</div>

<!-- Elevation profile panel -->
<div class="elev-panel" id="elev-panel">
  <div class="elev-header">
    <div>
      <h3>📈 Elevation Profile</h3>
      <div class="elev-stats" id="elev-stats"></div>
    </div>
    <button class="elev-close" onclick="closeElevation()">✕</button>
  </div>
  <div class="elev-chart" id="elev-chart"></div>
</div>

<div class="stats-bar">
  <span>Segments: <strong id="stat-segments">0</strong></span>
  <span>Total: <strong id="stat-km">0</strong> km</span>
  <span>Showing: <strong id="stat-showing">0</strong></span>
  <span id="stat-debug" style="display:none"></span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API = 'https://maps.ogsapps.cc/api';
const CLASSES = {
  cycle_track:         { label: 'Protected Bike Lane',  color: '#22c55e', weight: 5, group: 'high' },
  bike_path:           { label: 'Bike Path',            color: '#22c55e', weight: 5, group: 'high' },
  multi_use_path:      { label: 'Multi-Use Path',       color: '#14b8a6', weight: 4, group: 'high' },
  painted_bike_lane:   { label: 'Painted Bike Lane',    color: '#eab308', weight: 3, group: 'med' },
  local_street_bikeway:{ label: 'Local Street Bikeway', color: '#3b82f6', weight: 3, group: 'med' },
  shared_roadway:      { label: 'Shared Roadway',       color: '#f97316', weight: 2, group: 'low' },
  major_shared_roadway:{ label: 'Major Shared Roadway', color: '#ef4444', weight: 2, group: 'low' },
  gravel_trail:        { label: 'Gravel Trail',         color: '#92400e', weight: 2, group: 'low' },
};

const COMFORT = {
  high: { label: '🟢 High Comfort', color: '#22c55e' },
  med:  { label: '🟡 Medium Comfort', color: '#eab308' },
  low:  { label: '🔴 Low Comfort', color: '#f97316' },
};

let map, layers = {}, enabled = new Set(Object.keys(CLASSES)), municipalities = [], loading = false;
let highlightLine = null;
let currentMode = 'segments';  // 'segments' or 'routes'
let routeLayer = null;  // single layer for routes

// Init map
map = L.map('map', { zoomControl: true }).setView([49.28, -123.12], 12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://osm.org/copyright">OSM</a>',
  maxZoom: 18
}).addTo(map);

// Create layer groups
for (const [cls, info] of Object.entries(CLASSES)) {
  layers[cls] = L.layerGroup().addTo(map);
}

// Build legend
function buildLegend() {
  const el = document.getElementById('legend');
  let html = '';
  for (const [group, meta] of Object.entries(COMFORT)) {
    html += `<div style="font-size:11px;color:var(--text2);margin:8px 0 4px;text-transform:uppercase;letter-spacing:0.5px">${meta.label}</div>`;
    for (const [cls, info] of Object.entries(CLASSES)) {
      if (info.group !== group) continue;
      const isOn = enabled.has(cls);
      html += `<div class="legend-item ${isOn ? '' : 'disabled'}" data-class="${cls}">
        <div class="legend-swatch ${info.weight >= 4 ? 'thick' : ''}" style="background:${info.color}"></div>
        <span class="legend-label">${info.label}</span>
        <span class="legend-count" id="count-${cls}"></span>
      </div>`;
    }
  }
  el.innerHTML = html;
  el.querySelectorAll('.legend-item').forEach(item => {
    item.addEventListener('click', () => {
      const cls = item.dataset.class;
      if (enabled.has(cls)) { enabled.delete(cls); } else { enabled.add(cls); }
      toggleLayers();
      buildLegend();
    });
  });
}

function toggleLayers() {
  for (const [cls, lg] of Object.entries(layers)) {
    if (enabled.has(cls)) { if (!map.hasLayer(lg)) map.addLayer(lg); }
    else { if (map.hasLayer(lg)) map.removeLayer(lg); }
  }
}

// Load municipalities
async function loadMunicipalities() {
  try {
    const res = await fetch(`${API}/cycling/municipalities`);
    const data = await res.json();
    municipalities = data.municipalities || [];
    const sel = document.getElementById('muni-filter');
    municipalities.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.name;
      opt.textContent = `${m.name} (${m.km} km)`;
      sel.appendChild(opt);
    });
  } catch (e) { console.error('Failed to load municipalities', e); }
}

// Build class filter dropdown
function buildClassFilter() {
  const sel = document.getElementById('class-filter');
  for (const [cls, info] of Object.entries(CLASSES)) {
    const opt = document.createElement('option');
    opt.value = cls;
    opt.textContent = info.label;
    sel.appendChild(opt);
  }
}

// Mode switching
function setMode(mode) {
  currentMode = mode;
  document.getElementById('btn-segments').classList.toggle('active', mode === 'segments');
  document.getElementById('btn-routes').classList.toggle('active', mode === 'routes');
  loadCyclingData();
}

// Load cycling data for current view
async function loadCyclingData() {
  if (loading) return;
  const bounds = map.getBounds();
  const sw = bounds.getSouthWest();
  const ne = bounds.getNorthEast();
  
  const muni = document.getElementById('muni-filter').value;
  const cls = document.getElementById('class-filter').value;
  
  let url = `${API}/cycling/bbox?south=${sw.lat.toFixed(5)}&north=${ne.lat.toFixed(5)}&west=${sw.lng.toFixed(5)}&east=${ne.lng.toFixed(5)}&limit=2000`;
  if (muni) url += `&municipality=${encodeURIComponent(muni)}`;
  if (cls) url += `&class=${encodeURIComponent(cls)}`;
  if (currentMode === 'routes') url += '&mode=routes';
  
  loading = true;
  document.getElementById('loading').classList.remove('hidden');
  
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    console.log(`Loaded ${data.features?.length} features`, `zoom=${map.getZoom()}`, `bounds=${sw.lat.toFixed(3)},${sw.lng.toFixed(3)} to ${ne.lat.toFixed(3)},${ne.lng.toFixed(3)}`);
    renderFeatures(data.features || []);
  } catch (e) {
    console.error('Failed to load cycling data', e);
    document.getElementById('stat-debug').style.display = '';
    document.getElementById('stat-debug').textContent = 'Error: ' + e.message;
  } finally {
    loading = false;
    document.getElementById('loading').classList.add('hidden');
  }
}

function renderFeatures(features) {
  if (currentMode === 'routes') {
    renderRoutes(features);
    return;
  }
  // Clear all layers
  for (const lg of Object.values(layers)) lg.clearLayers();
  
  const counts = {};
  let totalKm = 0, shown = 0;
  
  features.forEach(f => {
    const props = f.properties;
    const cls = props.canbics_class;
    if (!cls || !CLASSES[cls]) return;
    counts[cls] = (counts[cls] || 0) + 1;
    totalKm += props.length_km || 0;
    
    if (!enabled.has(cls)) return;
    shown++;
    
    const info = CLASSES[cls];
    const coords = f.geometry.coordinates;
    
    // Convert MultiLineString coords to Leaflet latLng
    const lineGroups = coords.map(line => line.map(pt => [pt[1], pt[0]]));
    
    lineGroups.forEach(latlngs => {
      const line = L.polyline(latlngs, {
        color: info.color,
        weight: info.weight,
        opacity: 0.8,
        smoothFactor: 1,
      });
      
      line.bindTooltip(`${(props.length_km || 0).toFixed(1)} km`, { permanent: true, direction: 'center', className: 'segment-label' });

      line.on('click', (e) => {
        L.DomEvent.stopPropagation(e);
        showSegmentPopup(line, props, info);
        // Elevation profile disabled — data quality issues
      });
      
      // Hover highlight
      line.on('mouseover', () => line.setStyle({ weight: info.weight + 3, opacity: 1 }));
      line.on('mouseout', () => {
        if (highlightLine !== line) line.setStyle({ weight: info.weight, opacity: 0.8 });
      });
      
      layers[cls].addLayer(line);
    });
  });
  
  // Update stats
  document.getElementById('stat-segments').textContent = features.length.toLocaleString();
  document.getElementById('stat-km').textContent = totalKm.toFixed(1);
  document.getElementById('stat-showing').textContent = shown.toLocaleString();
  
  // Debug: show current bounds
  const b = map.getBounds();
  const dbg = document.getElementById('stat-debug');
  if (dbg) {
    dbg.style.display = '';
    dbg.textContent = `z${map.getZoom()} [${b.getSouthWest().lat.toFixed(3)},${b.getSouthWest().lng.toFixed(3)}]→[${b.getNorthEast().lat.toFixed(3)},${b.getNorthEast().lng.toFixed(3)}]`;
  }
  
  // Update legend counts
  for (const cls of Object.keys(CLASSES)) {
    const el = document.getElementById(`count-${cls}`);
    if (el) el.textContent = counts[cls] ? counts[cls].toLocaleString() : '';
  }
}

// Render merged routes (cross-class)
function renderRoutes(features) {
  // Clear segment layers and route layer
  for (const lg of Object.values(layers)) lg.clearLayers();
  if (routeLayer) map.removeLayer(routeLayer);
  routeLayer = L.layerGroup().addTo(map);
  
  let totalKm = 0, shown = 0;
  
  features.forEach(f => {
    const props = f.properties;
    totalKm += props.total_length_km || 0;
    shown++;
    
    const coords = f.geometry.coordinates;
    // All routes in blue
    const color = '#3b82f6';
    const weight = Math.min(2 + (props.segment_count || 1) * 0.2, 8);
    
    const lineGroups = coords.map(line => line.map(pt => [pt[1], pt[0]]));
    
    lineGroups.forEach(latlngs => {
      const line = L.polyline(latlngs, {
        color: color,
        weight: weight,
        opacity: 0.75,
        smoothFactor: 1,
      });
      
      // Use Leaflet built-in popup binding instead of manual click handler
      const popupContent = buildRoutePopup(props);
      line.bindPopup(popupContent);
      
      line.on('mouseover', () => line.setStyle({ weight: weight + 3, opacity: 1 }));
      line.on('mouseout', () => line.setStyle({ weight: weight, opacity: 0.75 }));
      
      routeLayer.addLayer(line);
    });
  });
  
  document.getElementById('stat-segments').textContent = shown.toLocaleString();
  document.getElementById('stat-km').textContent = totalKm.toFixed(1);
  document.getElementById('stat-showing').textContent = shown.toLocaleString();
}

function buildRoutePopup(props) {
  const comp = props.class_composition || {};
  const classChips = Object.entries(comp)
    .sort((a,b) => b[1] - a[1])
    .map(([cls, n]) => {
      const color = CLASSES[cls]?.color || '#666';
      return `<span style="background:${color}">${CLASSES[cls]?.label || cls} (${n})</span>`;
    }).join('');
  
  const km = props.total_length_km != null ? props.total_length_km.toFixed(2) : '?';
  return `
    <div style="font-weight:600;margin-bottom:4px">🔵 Route · ${km} km</div>
    <div style="font-size:12px;color:var(--text2)">${props.segment_count || 0} segments · ${props.total_points || 0} points</div>
    <div class="route-popup-class">${classChips}</div>
    ${props.municipality ? '<div style="font-size:11px;color:var(--text2);margin-top:4px">' + props.municipality + '</div>' : ''}
  `;
}

function showSegmentPopup(line, props, info) {
  // Remove previous highlight
  if (highlightLine) {
    const prevCls = highlightLine._canbics_cls;
    if (prevCls && CLASSES[prevCls]) {
      highlightLine.setStyle({ weight: CLASSES[prevCls].weight, opacity: 0.8 });
    }
  }
  highlightLine = line;
  line._canbics_cls = props.canbics_class;
  line.setStyle({ weight: info.weight + 4, opacity: 1 });

  let elevHtml = '';
  // Elevation data hidden — re-enable when data quality improves
  /*
  if (props.elevation_gain_m != null) {
    elevHtml = `<br>⬆ ${Math.round(props.elevation_gain_m)}m · ⬇ ${Math.round(props.elevation_loss_m || 0)}m`;
    if (props.elevation_min_m != null) {
      elevHtml += ` · ${Math.round(props.elevation_min_m)}–${Math.round(props.elevation_max_m)}m`;
    }
  }
  */
  line.bindPopup(`
    <div class="popup-class"><div class="popup-dot" style="background:${info.color}"></div>${info.label}</div>
    <div class="popup-meta">
      ${props.municipality}<br>
      ${props.length_km ? props.length_km.toFixed(2) + ' km' : ''} 
      ${props.surface_type ? '· ' + props.surface_type : ''}
      ${elevHtml}
      ${props.source_class ? '<br>' + props.source_class : ''}
    </div>
  `).openPopup();
}

// Elevation profile
async function loadElevationProfile(segId) {
  const panel = document.getElementById('elev-panel');
  const chartEl = document.getElementById('elev-chart');
  const statsEl = document.getElementById('elev-stats');
  
  statsEl.innerHTML = 'Loading…';
  chartEl.innerHTML = '';
  
  try {
    const res = await fetch(`${API}/cycling/elevation?id=${segId}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    
    if (!data.points || data.points.length < 2) {
      statsEl.innerHTML = 'No elevation data';
      panel.classList.add('open');
      return;
    }
    
    const stats = data.stats || {};
    const gain = stats.gain_m || 0;
    const loss = stats.loss_m || 0;
    const minElev = stats.min_m || 0;
    const maxElev = stats.max_m || 0;
    
    statsEl.innerHTML = `
      <span class="gain">⬆ ${Math.round(gain)}m</span>
      <span class="loss">⬇ ${Math.round(loss)}m</span>
      <span>${Math.round(minElev)}–${Math.round(maxElev)}m</span>
    `;
    
    renderElevChart(data.points, data.grades || []);
    panel.classList.add('open');
  } catch (e) {
    console.error('Failed to load elevation', e);
    statsEl.innerHTML = 'Failed to load';
    panel.classList.add('open');
  }
}

function renderElevChart(points, grades) {
  const chartEl = document.getElementById('elev-chart');
  const elevations = points.map(p => p[2]);
  const minE = Math.min(...elevations);
  const maxE = Math.max(...elevations);
  const range = maxE - minE || 1;
  
  const w = chartEl.clientWidth || 600;
  const h = 100;
  const pad = { top: 8, bottom: 18, left: 0, right: 0 };
  const cw = w - pad.left - pad.right;
  const ch = h - pad.top - pad.bottom;
  
  // Build path
  const coords = elevations.map((e, i) => {
    const x = pad.left + (i / (elevations.length - 1)) * cw;
    const y = pad.top + ch - ((e - minE) / range) * ch;
    return `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`;
  });
  
  // Gradient colors based on grade
  const gradeColors = grades.map(g => {
    if (g == null) return '#22c55e';
    if (g < -3) return '#3b82f6';  // steep downhill - blue
    if (g < 0) return '#60a5fa';   // gentle downhill
    if (g === 0) return '#22c55e'; // flat - green
    if (g <= 3) return '#eab308';  // gentle uphill - yellow
    if (g <= 6) return '#f97316';  // moderate - orange
    return '#ef4444';              // steep - red
  });
  
  // Fill polygon (area under curve)
  const fillPath = coords.join(' ') + 
    ` L${(pad.left + cw).toFixed(1)},${(pad.top + ch).toFixed(1)}` +
    ` L${pad.left.toFixed(1)},${(pad.top + ch).toFixed(1)} Z`;
  
  // SVG with gradient fill + colored line segments
  let segLines = '';
  for (let i = 1; i < elevations.length; i++) {
    const x1 = pad.left + ((i - 1) / (elevations.length - 1)) * cw;
    const y1 = pad.top + ch - ((elevations[i - 1] - minE) / range) * ch;
    const x2 = pad.left + (i / (elevations.length - 1)) * cw;
    const y2 = pad.top + ch - ((elevations[i] - minE) / range) * ch;
    segLines += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${gradeColors[i]}" stroke-width="2.5" stroke-linecap="round"/>`;
  }
  
  chartEl.innerHTML = `
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="elevFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#22c55e" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="#22c55e" stop-opacity="0.05"/>
        </linearGradient>
      </defs>
      <path d="${fillPath}" fill="url(#elevFill)" />
      ${segLines}
      <text x="${pad.left}" y="${h - 3}" font-size="10" fill="#94a3b8">${Math.round(minE)}m</text>
      <text x="${w - pad.right}" y="${h - 3}" font-size="10" fill="#94a3b8" text-anchor="end">${Math.round(maxE)}m</text>
    </svg>
  `;
}

function closeElevation() {
  document.getElementById('elev-panel').classList.remove('open');
  if (highlightLine) {
    const cls = highlightLine._canbics_cls;
    if (cls && CLASSES[cls]) {
      highlightLine.setStyle({ weight: CLASSES[cls].weight, opacity: 0.8 });
    }
    highlightLine = null;
  }
}

function reloadData() { loadCyclingData(); }

function resetView() {
  map.setView([49.28, -123.12], 12);
  document.getElementById('muni-filter').value = '';
  document.getElementById('class-filter').value = '';
  loadCyclingData();
}

function togglePanel() {
  const panel = document.getElementById('panel');
  panel.style.display = panel.style.display === 'none' ? '' : 'none';
}

// GPS Locator
let userMarker = null, userCircle = null, watchId = null, locating = false, firstFix = true;

function toggleLocate() {
  if (locating) { stopLocate(); return; }
  startLocate();
}

function startLocate() {
  if (!navigator.geolocation) {
    showLocateError('Geolocation not supported');
    return;
  }
  const btn = document.getElementById('btn-locate');
  btn.classList.add('active');
  btn.classList.remove('error');
  document.getElementById('locate-text').textContent = 'Locating…';
  document.getElementById('locate-icon').textContent = '⏳';
  locating = true;

  navigator.geolocation.getCurrentPosition(onLocation, onLocateError, {
    enableHighAccuracy: true, timeout: 15000, maximumAge: 60000
  });
  watchId = navigator.geolocation.watchPosition(onLocation, onLocateError, {
    enableHighAccuracy: true, timeout: 15000, maximumAge: 30000
  });
}

function onLocation(pos) {
  const { latitude, longitude, accuracy } = pos.coords;
  const latlng = [latitude, longitude];
  const btn = document.getElementById('btn-locate');
  btn.classList.remove('active', 'error');
  document.getElementById('locate-text').textContent = '📍 Live';
  document.getElementById('locate-icon').textContent = '';
  locating = true;

  if (!userMarker) {
    const icon = L.divIcon({ className: 'user-marker', html: '<div class="user-dot"></div>', iconSize: [18,18], iconAnchor: [9,9] });
    userMarker = L.marker(latlng, { icon, zIndexOffset: 1000 }).addTo(map);
    userMarker.bindTooltip('You are here', { direction: 'top', offset: [0, -14] });
  } else {
    userMarker.setLatLng(latlng);
  }
  if (userCircle) { map.removeLayer(userCircle); }
  if (accuracy) {
    userCircle = L.circle(latlng, { radius: accuracy, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.1, weight: 1, interactive: false }).addTo(map);
  }

  // Fly on first fix, pan on subsequent
  if (firstFix) { map.flyTo(latlng, Math.max(map.getZoom(), 14)); firstFix = false; }
  else { map.panTo(latlng, { animate: true, duration: 0.5 }); }
}

function stopLocate() {
  locating = false;
  firstFix = true;
  if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  if (userCircle) { map.removeLayer(userCircle); userCircle = null; }
  const btn = document.getElementById('btn-locate');
  btn.classList.remove('active', 'error');
  document.getElementById('locate-icon').textContent = '📍';
  document.getElementById('locate-text').textContent = 'Locate';
}

function onLocateError(err) { showLocateError(err.message); }

function showLocateError(msg) {
  stopLocate();
  const btn = document.getElementById('btn-locate');
  btn.classList.add('error');
  document.getElementById('locate-text').textContent = 'Error';
  document.getElementById('locate-icon').textContent = '⚠️';
  setTimeout(() => {
    btn.classList.remove('error');
    document.getElementById('locate-icon').textContent = '📍';
    document.getElementById('locate-text').textContent = 'Locate';
  }, 3000);
}

// Map events — reload on move/zoom with debounce
let moveTimeout;
map.on('moveend', () => {
  clearTimeout(moveTimeout);
  moveTimeout = setTimeout(loadCyclingData, 300);
});

// Handle window resize (maximize/restore)
window.addEventListener('resize', () => {
  map.invalidateSize();
  clearTimeout(moveTimeout);
  moveTimeout = setTimeout(loadCyclingData, 300);
});

// Init
buildLegend();
buildClassFilter();
loadMunicipalities();
loadCyclingData();
</script>
